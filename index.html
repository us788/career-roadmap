<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="로드맵">
<title>취업 로드맵 트래커</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f4f6f9; --surface: #ffffff; --ink: #17213a; --muted: #66718a; --line: #e1e6ee;
  --navy: #1f4e8c; --teal: #2a9d8f; --teal-soft: #dff2ef; --track: #e7ebf1;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1420; --surface: #161f31; --ink: #e5eaf3; --muted: #93a0b9; --line: #253149;
    --navy: #7aa3e6; --teal: #45c1b1; --teal-soft: #173a3a; --track: #222c41;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

/* 상단 날짜 */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.date { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin: 0; }
.theme { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.theme b { color: var(--ink); font-weight: 700; }
.today-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.exam-badge { display: inline-block; margin-left: 6px; font-size: 12px; font-weight: 700; color: #b4541a; background: #fbe9dc; border-radius: 6px; padding: 1px 7px; vertical-align: 2px; }
@media (prefers-color-scheme: dark) { .exam-badge { background: #3d2616; color: #f2a36b; } }

/* 240분 예산 바 */
.budget { margin: 22px 0 8px; }
.budget-total { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
.budget-total .num { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.budget-total .num small { font-size: 17px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.budget-total .pct { color: var(--muted); font-size: 14px; }
.bar { display: flex; gap: 3px; height: 34px; }
.seg { background: var(--track); border-radius: 6px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; transition: background .25s ease, color .25s ease; }
.seg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
.seg.done { background: var(--teal); color: #fff; }

/* 할 일 */
h2 { font-size: 13px; font-weight: 700; color: var(--muted); margin: 26px 0 8px; letter-spacing: 0.01em; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.task { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 16px; cursor: pointer; }
.task:first-child { border-top: 0; }
.check { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .2s ease, border-color .2s ease; }
.check svg { width: 14px; height: 14px; opacity: 0; transition: opacity .15s ease; }
.task[aria-checked="true"] .check { background: var(--teal); border-color: var(--teal); }
.task[aria-checked="true"] .check svg { opacity: 1; }
.task-body { flex: 1; min-width: 0; }
.task-title { font-weight: 700; font-size: 16px; }
.task-note { color: var(--muted); font-size: 13.5px; margin-top: 1px; }
.task[aria-checked="true"] .task-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.task-min { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 투두 */
.todo { display: flex; align-items: center; border-top: 1px solid var(--line); }
.todo:first-child { border-top: 0; }
.todo .task { border-top: 0; flex: 1; min-width: 0; }
.todo .task-title { font-weight: 600; overflow-wrap: anywhere; }
.del { flex: 0 0 40px; height: 40px; margin-right: 8px; border: 0; background: none; color: var(--muted); border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.del svg { width: 16px; height: 16px; }
.del:hover { background: var(--bg); color: var(--ink); }
.add { display: flex; align-items: center; gap: 14px; margin: 0; padding: 9px 10px 9px 16px; border-top: 1px solid var(--line); }
.todos:empty + .add { border-top: 0; }
.plus { flex: 0 0 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--muted); transition: border-color .2s ease, color .2s ease; }
.plus svg { width: 12px; height: 12px; }
.add:focus-within .plus { border-color: var(--navy); color: var(--navy); }
.add input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; padding: 6px 0; }
.add input:focus { outline: none; }
.add input::placeholder { color: var(--muted); }
.add-btn { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
.add-btn:disabled { opacity: .45; cursor: default; }

textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 12px 14px; font: inherit; font-size: 15px; }
textarea::placeholder { color: var(--muted); }

/* 주간 */
.week-head { display: flex; align-items: center; justify-content: space-between; margin: 26px 0 8px; }
.week-head h2 { margin: 0; }
.week-nav { display: flex; gap: 4px; }
.week-nav button { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 28px; border-radius: 8px; cursor: pointer; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0 9px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.day .dn { font-size: 12px; color: var(--muted); }
.day .dd { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.day .mini { width: 70%; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.day .mini i { display: block; height: 100%; background: var(--teal); }
.day.is-today .dd { color: var(--navy); }
.day.is-sel { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.stats { display: flex; gap: 18px; margin-top: 12px; color: var(--muted); font-size: 14px; }
.stats b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }

/* 설정 */
details { margin-top: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
summary { padding: 14px 16px; font-weight: 700; cursor: pointer; }
.set { padding: 4px 16px 16px; display: grid; gap: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row p { margin: 0; }
.row .sub { color: var(--muted); font-size: 13px; }
.switch { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--track); position: relative; cursor: pointer; flex: 0 0 auto; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.switch:checked { background: var(--teal); }
.switch:checked::after { transform: translateX(18px); }
.radios { display: grid; gap: 8px; }
.radios label { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; cursor: pointer; }
.radios input { margin-top: 4px; accent-color: var(--teal); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button, .btns label { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
.msg { color: var(--muted); font-size: 13px; min-height: 1em; }


/* GitHub 저장 */
.sync { margin-top: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.primary { border: 0; background: var(--navy); color: #fff; font-weight: 700; border-radius: 12px; padding: 11px 16px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
@media (prefers-color-scheme: dark) { .primary { color: #0e1420; } }
.primary:disabled { opacity: .6; cursor: progress; }
.primary svg { width: 18px; height: 18px; }
.sync-msg { color: var(--muted); font-size: 13.5px; }
.sync-msg.dirty { color: #b4541a; font-weight: 600; }
@media (prefers-color-scheme: dark) { .sync-msg.dirty { color: #f2a36b; } }
.sync-msg.err { color: #c0392b; font-weight: 600; }
@media (prefers-color-scheme: dark) { .sync-msg.err { color: #ff8a7a; } }
.field { display: grid; gap: 4px; }
.field span { font-size: 13px; color: var(--muted); }
.field input { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); padding: 9px 11px; font: inherit; font-size: 15px; width: 100%; }
.gh-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }

footer { margin-top: 28px; display: flex; gap: 16px; font-size: 14px; }
footer a { color: var(--navy); text-decoration: none; font-weight: 600; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1 class="date" id="date"></h1>
      <p class="theme" id="theme"></p>
    </div>
    <button class="today-btn" id="toToday" hidden>오늘로</button>
  </div>

  <section class="budget" aria-label="오늘 로드맵 시간">
    <div class="budget-total">
      <div class="num" id="minDone">0<small> / 240분</small></div>
      <div class="pct" id="pct"></div>
    </div>
    <div class="bar" id="bar"></div>
  </section>

  <h2>로드맵</h2>
  <div class="list" id="roadmap" role="group" aria-label="로드맵 할 일"></div>

  <h2>생활</h2>
  <div class="list" id="life" role="group" aria-label="생활 할 일"></div>

  <h2 id="todoLabel">오늘의 투두</h2>
  <div class="list">
    <div class="todos" id="todos" role="group" aria-labelledby="todoLabel"></div>
    <form class="add" id="todoForm" autocomplete="off">
      <span class="plus" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 1.5v9M1.5 6h9"/></svg></span>
      <input id="todoInput" maxlength="200" placeholder="오늘 할 일 추가" aria-label="투두 추가">
      <button type="submit" class="add-btn" id="todoAdd" disabled>추가</button>
    </form>
  </div>

  <h2><label for="memo">오늘 한 것</label></h2>
  <textarea id="memo" placeholder="예: 스프링 핵심 원리 섹션 3, 프로그래머스 2문제, TCP 3-way handshake 정리"></textarea>

  <div class="week-head">
    <h2 id="weekLabel"></h2>
    <div class="week-nav">
      <button id="prevWeek" aria-label="지난주">‹</button>
      <button id="nextWeek" aria-label="다음 주">›</button>
    </div>
  </div>
  <div class="week" id="week"></div>
  <div class="stats">
    <div>연속 달성 <b id="streak">0</b>일</div>
    <div>이번 주 <b id="weekMin">0</b>분</div>
  </div>

  <div class="sync">
    <button type="button" class="primary" id="pushBtn">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      <span id="pushLabel">GitHub에 저장</span>
    </button>
    <span class="sync-msg" id="syncMsg" role="status"></span>
  </div>

  <details>
    <summary>설정</summary>
    <div class="set">
      <div class="row">
        <div><p>시험 기간 모드</p><p class="sub">딥워크를 끄고 고정 루틴 1시간만 표시합니다.</p></div>
        <input type="checkbox" class="switch" id="exam" aria-label="시험 기간 모드">
      </div>
      <div>
        <p style="margin:0 0 8px">학습 단계</p>
        <div class="radios">
          <label><input type="radio" name="phase" value="1"> <span>기초 단계<br><span class="sub" style="color:var(--muted);font-size:13px">금·토도 Java / Spring에 씁니다.</span></span></label>
          <label><input type="radio" name="phase" value="2"> <span>실무 단계<br><span class="sub" style="color:var(--muted);font-size:13px">금·토는 백엔드 실무와 통합 실습에 씁니다.</span></span></label>
        </div>
      </div>
      <div id="ghSection">
        <p style="margin:0 0 8px">GitHub 연결</p>
        <div style="display:grid;gap:8px">
          <div class="gh-grid">
            <label class="field"><span>저장소</span><input id="ghRepo" autocomplete="off" spellcheck="false" placeholder="us788/career-roadmap"></label>
            <label class="field"><span>브랜치</span><input id="ghBranch" autocomplete="off" spellcheck="false" placeholder="main"></label>
          </div>
          <label class="field"><span>토큰 (Contents 읽기·쓰기 권한)</span><input id="ghToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_로 시작하는 토큰"></label>
          <div class="btns">
            <button type="button" id="ghConnect">연결</button>
            <button type="button" id="ghDisconnect">연결 해제</button>
          </div>
          <p class="msg" id="ghMsg"></p>
        </div>
      </div>
      <div>
        <p style="margin:0 0 8px">기록 백업</p>
        <div class="btns">
          <button id="exportBtn">내보내기</button>
          <label>불러오기<input type="file" id="importFile" accept="application/json" hidden></label>
        </div>
        <p class="msg" id="msg">GitHub에 연결하지 않은 기기에서 기록을 옮길 때 씁니다. 토큰은 내보내기 파일에 들어가지 않습니다.</p>
      </div>
    </div>
  </details>

  <footer>
    <a href="docs/roadmap.pdf">로드맵 PDF</a>
    <a href="https://github.com/us788/career-roadmap/blob/main/MILESTONES.md">마일스톤 체크리스트</a>
  </footer>
</main>

<script>
(function () {
  const KEY = "career-roadmap:v1";        // 학습 기록 (GitHub에 올라감)
  const GH_KEY = "career-roadmap:github"; // 연결 정보와 토큰 (이 기기에만 남음)
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const PROJECT_DAYS = [1, 2, 3, 4, 5];    // 월~금
  const DATA_PATH = "data/tracker.json";
  const LOG_PATH = "LOG.md";

  const THEMES = {
    1: { 1: "Java / Spring", 2: "AI 엔지니어링", 3: "Java / Spring", 4: "AI 엔지니어링", 5: "Java / Spring", 6: "Java / Spring 복습과 주간 커밋" },
    2: { 1: "Java / Spring", 2: "AI 엔지니어링", 3: "Java / Spring", 4: "AI 엔지니어링", 5: "백엔드 실무", 6: "백엔드 통합 실습과 주간 커밋" }
  };
  const THEME_NOTE = {
    "Java / Spring": "강의 듣고 코드는 직접 따라 치기",
    "AI 엔지니어링": "이번 사이클 주제 실험하고 수치 기록",
    "백엔드 실무": "실습 서비스 다음 단계 진행",
    "Java / Spring 복습과 주간 커밋": "이번 주 코드 정리해서 커밋",
    "백엔드 통합 실습과 주간 커밋": "이번 주 결과물 연결하고 커밋"
  };

  // ---- 로컬 저장 ----
  function load(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function normalize(data) {
    return {
      settings: Object.assign({ exam: false, phase: 1, updated: 0 }, (data && data.settings) || {}),
      days: (data && typeof data.days === "object" && data.days) || {}
    };
  }
  let state = normalize(load(KEY, null));
  let gh = Object.assign({ repo: "us788/career-roadmap", branch: "main", token: "", lastSaved: 0, dirty: false }, load(GH_KEY, {}));

  function saveLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { setSync("이 브라우저에서는 기록을 저장할 수 없습니다. 개인정보 보호 모드인지 확인하세요.", "err"); }
  }
  function saveGh() { try { localStorage.setItem(GH_KEY, JSON.stringify(gh)); } catch (e) {} }
  function changed() { gh.dirty = true; saveGh(); saveLocal(); }

  // ---- 날짜 ----
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const weekStart = d => addDays(d, -((d.getDay() + 6) % 7));
  const todayKey = () => keyOf(new Date());

  let selKey = todayKey();
  let viewWeek = weekStart(new Date());

  // ---- 그날의 할 일 ----
  function modeFor(k) {
    const r = state.days[k];
    return r && r.mode ? r.mode : { exam: state.settings.exam, phase: state.settings.phase };
  }
  function plan(k) {
    const d = fromKey(k), wd = d.getDay(), mode = modeFor(k);
    const road = [], life = [];
    if (wd === 0) {
      road.push({ id: "review", title: "주간 회고", note: "체크리스트 갱신, 밀린 항목은 토요일로", min: 30, short: "회고" });
    } else if (mode.exam) {
      road.push({ id: "coding", title: "코딩 테스트", note: "프로그래머스 1문제 (Java)", min: 30, short: "코테" });
      road.push({ id: "cs", title: "CS", note: "질문 1개 1분 답변", min: 15, short: "CS" });
      road.push({ id: "opic", title: "OPIc", note: "답변 1개 녹음", min: 15, short: "OPIc" });
    } else {
      const theme = THEMES[mode.phase][wd];
      road.push({ id: "deep", title: "딥워크 · " + theme, note: THEME_NOTE[theme], min: 150, short: "딥워크" });
      road.push({ id: "coding", title: "코딩 테스트", note: "프로그래머스 2문제 (Java)", min: 45, short: "코테" });
      road.push({ id: "cs", title: "CS", note: "질문 1~2개 1분 답변 후 정리", min: 30, short: "CS" });
      road.push({ id: "opic", title: "OPIc", note: "답변 1개 녹음하고 다시 듣기", min: 15, short: "OPIc" });
    }
    life.push({ id: "workout", title: "운동", note: "이동 포함 1시간 30분", min: 60, short: "운동" });
    if (PROJECT_DAYS.includes(wd)) life.push({ id: "project", title: "학교 프로젝트", note: "", min: 60, short: "프로젝트" });
    return { road, life, theme: wd === 0 ? "휴식과 주간 회고" : (mode.exam ? "시험 기간" : THEMES[mode.phase][wd]), exam: wd !== 0 && mode.exam };
  }
  function rec(k) {
    if (!state.days[k]) state.days[k] = { mode: { exam: state.settings.exam, phase: state.settings.phase }, done: {}, memo: "", todos: [], updated: 0 };
    return state.days[k];
  }
  // 직접 추가한 투두 (로드맵 시간과 연속 달성에는 들어가지 않음)
  const todosOf = r => (r && Array.isArray(r.todos) ? r.todos : []);
  function progress(k) {
    const p = plan(k), done = (state.days[k] && state.days[k].done) || {};
    const total = p.road.reduce((s, t) => s + t.min, 0);
    const got = p.road.reduce((s, t) => s + (done[t.id] ? t.min : 0), 0);
    return { total, got, complete: total > 0 && got === total };
  }

  // ---- 그리기 ----
  const $ = id => document.getElementById(id);
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  function taskRow(t, done) {
    const b = document.createElement("button");
    b.className = "task"; b.type = "button";
    b.setAttribute("role", "checkbox");
    b.setAttribute("aria-checked", done ? "true" : "false");
    b.innerHTML = '<span class="check">' + CHECK_SVG + '</span>' +
      '<span class="task-body"><div class="task-title"></div>' + (t.note ? '<div class="task-note"></div>' : "") + '</span>' +
      '<span class="task-min">' + (t.min >= 60 && t.min % 60 === 0 ? (t.min / 60) + "시간" : t.min + "분") + '</span>';
    b.querySelector(".task-title").textContent = t.title;
    if (t.note) b.querySelector(".task-note").textContent = t.note;
    b.addEventListener("click", () => {
      const r = rec(selKey);
      r.done[t.id] = !r.done[t.id];
      r.updated = Date.now();
      changed(); render();
    });
    return b;
  }

  const X_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
  function editTodos(fn) {
    const r = rec(selKey);
    const list = todosOf(r).slice();
    r.todos = fn(list) || list;
    r.updated = Date.now();
    changed(); syncOverride = null; render();
  }
  function todoRow(t) {
    const row = document.createElement("div");
    row.className = "todo";
    const b = document.createElement("button");
    b.className = "task"; b.type = "button";
    b.setAttribute("role", "checkbox");
    b.setAttribute("aria-checked", t.done ? "true" : "false");
    b.innerHTML = '<span class="check">' + CHECK_SVG + '</span><span class="task-body"><div class="task-title"></div></span>';
    b.querySelector(".task-title").textContent = t.text;
    b.addEventListener("click", () => editTodos(list => list.map(x => x.id === t.id ? Object.assign({}, x, { done: !x.done }) : x)));
    const del = document.createElement("button");
    del.className = "del"; del.type = "button";
    del.setAttribute("aria-label", t.text + " 삭제");
    del.innerHTML = X_SVG;
    del.addEventListener("click", () => editTodos(list => list.filter(x => x.id !== t.id)));
    row.append(b, del);
    return row;
  }

  function render() {
    const d = fromKey(selKey), p = plan(selKey), r = state.days[selKey], done = (r && r.done) || {};
    const isToday = selKey === todayKey();

    $("date").textContent = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + DAYS[d.getDay()] + "요일";
    $("theme").innerHTML = "";
    const b = document.createElement("b"); b.textContent = p.theme;
    $("theme").append(document.createTextNode(isToday ? "오늘의 주제 " : "이날의 주제 "), b);
    if (p.exam) { const s = document.createElement("span"); s.className = "exam-badge"; s.textContent = "시험 모드"; $("theme").append(s); }
    $("toToday").hidden = isToday;

    const pr = progress(selKey);
    $("minDone").innerHTML = pr.got + "<small> / " + pr.total + "분</small>";
    $("pct").textContent = pr.complete ? "이날 몫 완료" : Math.round(pr.got / pr.total * 100) + "%";
    const bar = $("bar"); bar.innerHTML = "";
    p.road.forEach(t => {
      const s = document.createElement("div");
      s.className = "seg" + (done[t.id] ? " done" : "");
      s.style.flex = t.min + " 1 0";
      s.title = t.title + " " + t.min + "분";
      if (t.min >= 30) { s.innerHTML = "<span></span>"; s.firstChild.textContent = t.short; }
      bar.appendChild(s);
    });

    const road = $("roadmap"); road.innerHTML = "";
    p.road.forEach(t => road.appendChild(taskRow(t, !!done[t.id])));
    const life = $("life"); life.innerHTML = "";
    p.life.forEach(t => life.appendChild(taskRow(t, !!done[t.id])));

    $("todoLabel").textContent = isToday ? "오늘의 투두" : "이날의 투두";
    const todos = $("todos"); todos.innerHTML = "";
    todosOf(r).forEach(t => todos.appendChild(todoRow(t)));
    $("todoInput").placeholder = isToday ? "오늘 할 일 추가" : "이날 할 일 추가";

    const memo = $("memo");
    if (document.activeElement !== memo) memo.value = (r && r.memo) || "";
    memo.placeholder = d.getDay() === 0 ? "이번 주 잘된 것, 밀린 것, 다음 주에 바꿀 것" : "예: 스프링 핵심 원리 섹션 3, 프로그래머스 2문제, TCP 3-way handshake 정리";

    renderWeek();
    renderSettings();
    renderSync();
  }

  function renderWeek() {
    const wk = $("week"); wk.innerHTML = "";
    const start = viewWeek, end = addDays(start, 6);
    const thisWeek = keyOf(start) === keyOf(weekStart(new Date()));
    $("weekLabel").textContent = thisWeek ? "이번 주" : (start.getMonth() + 1) + "/" + start.getDate() + " – " + (end.getMonth() + 1) + "/" + end.getDate();
    let weekMin = 0;
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i), k = keyOf(d), pr = progress(k);
      weekMin += pr.got;
      const c = document.createElement("button");
      c.type = "button";
      c.className = "day" + (k === todayKey() ? " is-today" : "") + (k === selKey ? " is-sel" : "");
      c.setAttribute("aria-label", (d.getMonth() + 1) + "월 " + d.getDate() + "일, " + pr.total + "분 중 " + pr.got + "분");
      c.innerHTML = '<span class="dn">' + DAYS[d.getDay()] + '</span><span class="dd">' + d.getDate() + '</span><span class="mini"><i style="width:' + (pr.total ? pr.got / pr.total * 100 : 0) + '%"></i></span>';
      c.addEventListener("click", () => { selKey = k; render(); });
      wk.appendChild(c);
    }
    $("weekMin").textContent = weekMin;

    let streak = 0, d = new Date();
    if (!progress(keyOf(d)).complete) d = addDays(d, -1);
    while (progress(keyOf(d)).complete && streak < 3650) { streak++; d = addDays(d, -1); }
    $("streak").textContent = streak;
  }

  function renderSettings() {
    $("exam").checked = !!state.settings.exam;
    document.querySelectorAll('input[name="phase"]').forEach(el => { el.checked = Number(el.value) === Number(state.settings.phase); });
    if (document.activeElement !== $("ghRepo")) $("ghRepo").value = gh.repo;
    if (document.activeElement !== $("ghBranch")) $("ghBranch").value = gh.branch;
    $("ghToken").placeholder = gh.token ? "저장된 토큰이 있습니다. 바꿀 때만 입력하세요." : "github_pat_로 시작하는 토큰";
    $("ghDisconnect").hidden = !gh.token;
  }

  // ---- GitHub 동기화 ----
  let busy = false, syncOverride = null;
  function setSync(text, kind) { syncOverride = { text, kind }; renderSync(); }
  function fmtTime(ts) {
    const d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function renderSync() {
    const msg = $("syncMsg");
    $("pushBtn").disabled = busy;
    $("pushLabel").textContent = busy ? "저장하는 중" : "GitHub에 저장";
    let text, kind = "";
    if (syncOverride) { text = syncOverride.text; kind = syncOverride.kind || ""; }
    else if (!gh.token) text = "설정에서 GitHub를 연결하면 저장할 수 있습니다.";
    else if (gh.dirty) { text = "저장하지 않은 변경이 있습니다."; kind = "dirty"; }
    else text = gh.lastSaved ? "마지막 저장 " + fmtTime(gh.lastSaved) : "GitHub와 같은 상태입니다.";
    msg.textContent = text;
    msg.className = "sync-msg" + (kind ? " " + kind : "");
  }

  function apiErr(status) {
    if (status === 401) return "토큰이 올바르지 않거나 만료되었습니다. 설정에서 새 토큰을 입력하세요.";
    if (status === 403) return "토큰에 이 저장소의 Contents 쓰기 권한이 없습니다.";
    if (status === 404) return "저장소나 브랜치를 찾을 수 없습니다. 이름과 토큰의 저장소 접근 범위를 확인하세요.";
    if (status === 409) return "저장소가 비어 있습니다. 먼저 첫 커밋을 push하세요.";
    if (status === 0) return "GitHub에 연결하지 못했습니다. 인터넷 연결을 확인하세요.";
    return "GitHub 요청이 실패했습니다 (" + status + "). 잠시 뒤 다시 시도하세요.";
  }
  async function api(path, opts) {
    opts = opts || {};
    const headers = { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + gh.token, "X-GitHub-Api-Version": "2022-11-28" };
    if (opts.body) headers["Content-Type"] = "application/json";
    let res;
    try { res = await fetch("https://api.github.com/repos/" + gh.repo + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" }); }
    catch (e) { const err = new Error("network"); err.status = 0; throw err; }
    if (!res.ok) { const err = new Error("http"); err.status = res.status; throw err; }
    return res.status === 204 ? null : res.json();
  }
  function decodeB64(b64) {
    const bin = atob(b64.replace(/\s/g, ""));
    return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
  }
  async function fetchRemote() {
    try {
      const f = await api("/contents/" + DATA_PATH + "?ref=" + encodeURIComponent(gh.branch));
      return normalize(JSON.parse(decodeB64(f.content)));
    } catch (e) {
      if (e.status === 404) return null;   // 아직 한 번도 저장하지 않음
      throw e;
    }
  }
  // 날짜마다 더 최근에 고친 쪽을 남김
  function merge(local, remote) {
    if (!remote) return local;
    const out = { settings: (remote.settings.updated || 0) > (local.settings.updated || 0) ? remote.settings : local.settings, days: {} };
    const keys = new Set(Object.keys(local.days).concat(Object.keys(remote.days)));
    keys.forEach(k => {
      const a = local.days[k], b = remote.days[k];
      out.days[k] = !a ? b : !b ? a : ((b.updated || 0) > (a.updated || 0) ? b : a);
    });
    return out;
  }
  const stable = o => JSON.stringify(o, null, 2) + "\n";

  // 표 칸용: 파이프는 이스케이프, <는 &lt;로 바꿔 List<String> 같은 글이 HTML 태그로 사라지지 않게 함
  function cell(t) { return String(t || "").replace(/</g, "&lt;").replace(/\|/g, "\\|").replace(/\r?\n/g, "<br>").trim(); }
  function buildLog() {
    const active = Object.keys(state.days).filter(k => {
      const r = state.days[k];
      return (r.memo && r.memo.trim()) || Object.values(r.done || {}).some(Boolean) || todosOf(r).length > 0;
    }).sort().reverse();
    const lines = ["# 학습 기록", "", "트래커의 \"GitHub에 저장\" 버튼으로 자동 생성되는 파일입니다. 직접 고치면 다음 저장 때 덮어씁니다.", ""];
    if (!active.length) { lines.push("아직 기록이 없습니다.", ""); return lines.join("\n"); }
    const weeks = {};
    active.forEach(k => { const w = keyOf(weekStart(fromKey(k))); (weeks[w] = weeks[w] || []).push(k); });
    Object.keys(weeks).sort().reverse().forEach(w => {
      const ks = weeks[w];
      const total = ks.reduce((s, k) => s + progress(k).got, 0);
      lines.push("## " + w + " 주 (로드맵 " + total + "분)", "", "| 날짜 | 주제 | 로드맵 | 완료 | 투두 | 한 것 |", "|---|---|---|---|---|---|");
      ks.forEach(k => {
        const d = fromKey(k), p = plan(k), r = state.days[k], pr = progress(k);
        const doneNames = p.road.concat(p.life).filter(t => r.done && r.done[t.id]).map(t => t.short).join(", ");
        const todoList = todosOf(r).map(t => (t.done ? "✓ " : "☐ ") + cell(t.text)).join("<br>");
        lines.push("| " + (d.getMonth() + 1) + "/" + d.getDate() + " (" + DAYS[d.getDay()] + ") | " + cell(p.theme) + " | " + pr.got + " / " + pr.total + "분 | " + cell(doneNames) + " | " + todoList + " | " + cell(r.memo) + " |");
      });
      lines.push("");
    });
    return lines.join("\n");
  }

  async function pull(quiet) {
    if (!gh.token || busy) return;
    try {
      const remote = await fetchRemote();
      if (!remote) return;
      const merged = merge(state, remote);
      state = merged;
      gh.dirty = stable(merged) !== stable(remote);
      saveLocal(); saveGh();
      if (!quiet) setSync("GitHub의 기록을 불러왔습니다.");
      render();
    } catch (e) { setSync(apiErr(e.status), "err"); }
  }

  async function push() {
    if (!gh.token) {
      const det = document.querySelector("details"); det.open = true;
      $("ghToken").focus();
      setSync("토큰을 입력하고 연결하면 저장할 수 있습니다.", "err");
      return;
    }
    if (busy) return;
    busy = true; syncOverride = null; renderSync();
    try {
      for (let attempt = 0; attempt < 2; attempt++) {
        const ref = await api("/git/ref/heads/" + encodeURIComponent(gh.branch));
        const head = await api("/git/commits/" + ref.object.sha);
        state = merge(state, await fetchRemote());
        saveLocal();
        const tree = await api("/git/trees", { method: "POST", body: {
          base_tree: head.tree.sha,
          tree: [
            { path: DATA_PATH, mode: "100644", type: "blob", content: stable(state) },
            { path: LOG_PATH, mode: "100644", type: "blob", content: buildLog() }
          ]
        } });
        if (tree.sha === head.tree.sha) { gh.dirty = false; gh.lastSaved = Date.now(); saveGh(); setSync("바뀐 내용이 없어 커밋하지 않았습니다."); break; }
        const t = todayKey(), pr = progress(t);
        const commit = await api("/git/commits", { method: "POST", body: {
          message: "기록 업데이트: " + t + " (로드맵 " + pr.got + "/" + pr.total + "분)",
          tree: tree.sha,
          parents: [ref.object.sha]
        } });
        try {
          await api("/git/refs/heads/" + encodeURIComponent(gh.branch), { method: "PATCH", body: { sha: commit.sha } });
        } catch (e) {
          if (e.status === 422 && attempt === 0) continue;   // 다른 기기가 먼저 저장함: 다시 합쳐서 재시도
          throw e;
        }
        gh.dirty = false; gh.lastSaved = Date.now(); saveGh(); syncOverride = null;
        break;
      }
    } catch (e) {
      setSync(apiErr(e.status), "err");
    } finally {
      busy = false; render();
    }
  }

  // ---- 이벤트 ----
  $("toToday").addEventListener("click", () => { selKey = todayKey(); viewWeek = weekStart(new Date()); render(); });
  $("prevWeek").addEventListener("click", () => { viewWeek = addDays(viewWeek, -7); renderWeek(); });
  $("nextWeek").addEventListener("click", () => { viewWeek = addDays(viewWeek, 7); renderWeek(); });
  $("pushBtn").addEventListener("click", push);

  let memoTimer;
  $("memo").addEventListener("input", e => {
    const v = e.target.value, k = selKey;
    clearTimeout(memoTimer);
    memoTimer = setTimeout(() => { const r = rec(k); r.memo = v; r.updated = Date.now(); changed(); syncOverride = null; renderSync(); }, 300);
  });

  // 투두 추가: form submit을 쓰면 한글 입력 중 Enter를 눌러도 한 번만 추가됨
  const syncAddBtn = () => { $("todoAdd").disabled = !$("todoInput").value.trim(); };
  $("todoInput").addEventListener("input", syncAddBtn);
  $("todoForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = $("todoInput"), text = input.value.trim();
    if (!text) return;
    const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    editTodos(list => list.concat({ id, text, done: false }));
    input.value = ""; syncAddBtn();
  });

  // 설정 변경은 오늘과 이후 날짜에 적용 (지난 기록은 그대로)
  function applySettings() {
    state.settings.updated = Date.now();
    const t = state.days[todayKey()];
    if (t) { t.mode = { exam: state.settings.exam, phase: state.settings.phase }; t.updated = Date.now(); }
    changed(); render();
  }
  $("exam").addEventListener("change", e => { state.settings.exam = e.target.checked; applySettings(); });
  document.querySelectorAll('input[name="phase"]').forEach(el => el.addEventListener("change", e => {
    state.settings.phase = Number(e.target.value); applySettings();
  }));

  $("ghConnect").addEventListener("click", async () => {
    const repo = $("ghRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/$/, "");
    const branch = $("ghBranch").value.trim() || "main";
    const token = $("ghToken").value.trim() || gh.token;
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $("ghMsg").textContent = "저장소는 사용자명/저장소 형식으로 입력하세요. 예: us788/career-roadmap"; return; }
    if (!token) { $("ghMsg").textContent = "토큰을 입력하세요."; return; }
    const prev = Object.assign({}, gh);
    gh.repo = repo; gh.branch = branch; gh.token = token;
    $("ghMsg").textContent = "연결을 확인하는 중입니다.";
    try {
      const info = await api("");
      if (info.permissions && info.permissions.push === false) throw Object.assign(new Error(), { status: 403 });
      await api("/git/ref/heads/" + encodeURIComponent(branch));
      saveGh(); $("ghToken").value = "";
      $("ghMsg").textContent = repo + " (" + branch + ")에 연결했습니다.";
      await pull(false);
    } catch (e) {
      gh = prev; saveGh();
      $("ghMsg").textContent = apiErr(e.status);
    }
    render();
  });
  $("ghDisconnect").addEventListener("click", () => {
    gh.token = ""; saveGh();
    $("ghMsg").textContent = "이 기기에서 토큰을 지웠습니다. 학습 기록은 그대로 남아 있습니다.";
    syncOverride = null; render();
  });

  $("exportBtn").addEventListener("click", () => {
    const blob = new Blob([stable(state)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "roadmap-tracker-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $("msg").textContent = "기록 파일을 내려받았습니다.";
  });
  $("importFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data.days !== "object") throw new Error();
        state = merge(state, normalize(data));
        changed(); render();
        $("msg").textContent = "기록을 불러와 지금 기록과 합쳤습니다.";
      } catch (err) { $("msg").textContent = "불러오지 못했습니다. 이 트래커에서 내보낸 JSON 파일인지 확인하세요."; }
      e.target.value = "";
    };
    reader.readAsText(f);
  });

  // 다른 기기에서 저장한 기록 반영: 열 때, 그리고 다시 볼 때 (저장 안 된 변경이 없을 때만)
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !gh.dirty) pull(true); });

  let lastToday = todayKey();
  setInterval(() => {
    const t = todayKey();
    if (t !== lastToday) { if (selKey === lastToday) selKey = t; lastToday = t; viewWeek = weekStart(new Date()); render(); }
  }, 60000);

  render();
  pull(true);
})();
